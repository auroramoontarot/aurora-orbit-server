:root{
  --lav:#7f87ff;

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Quicksand',sans-serif;
  background:transparent;
}

.overlay{
  position:relative;

  width:375px;
  height:300px;

  overflow:hidden;

  border:2px solid rgba(203,236,245,.35);
  border-radius:24px;

  box-shadow:
    0 0 20px rgba(0,169,186,.30),
    inset 0 0 18px rgba(203,236,245,.08);
}

.map{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:.82;
}

.glow{
  position:absolute;

  width:50px;
  height:50px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(127,135,255,.90) 0%,
      rgba(0,169,186,.55) 40%,
      rgba(0,169,186,0) 100%
    );

  transform:translate(-50%,-50%);

  filter:blur(8px);

  transition:
    left 1.2s ease,
    top 1.2s ease;
}

.card{
  position:absolute;

  left:10px;
  bottom:10px;

  width:220px;

  background:rgba(18,16,48,.92);
  backdrop-filter:blur(10px);

  border:1px solid rgba(203,236,245,.22);
  border-radius:18px;

  padding:12px;
}

.badge{
  font-size:11px;
  color:var(--soft);
  margin-bottom:6px;
}

.location{
  font-size:18px;
  font-weight:700;
  color:white;
  line-height:1.1;
}

.title{
  margin-top:4px;

  color:var(--ice);

  font-size:12px;
  font-weight:600;
}

.quote{
  margin-top:8px;

  font-size:12px;
  line-height:1.25;

  color:white;
}

.footer{
  margin-top:8px;

  font-size:9px;
  color:var(--soft);
}

.twinkle{
  position:absolute;

  top:10px;
  right:12px;

  font-size:16px;

  color:white;

  animation:floaty 3s ease-in-out infinite;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0);
    opacity:.7;
  }

  50%{
    transform:translateY(-4px);
    opacity:1;
  }
}
