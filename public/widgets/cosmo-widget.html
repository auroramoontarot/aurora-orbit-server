<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  font-family: "Quicksand", sans-serif;
}

#mascot-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 320px;
  height: 320px;
  pointer-events: none;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  transition: opacity 0.3s ease;
}

#text-bubble {
  position: absolute;
  bottom: 340px;
  left: 10px;
  max-width: 260px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(18,24,42,0.6);
  backdrop-filter: blur(12px);
  color: #cbecf5;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.2s ease;
}

#text-bubble.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="mascot-container">
  <video id="v1" autoplay muted></video>
  <video id="v2" muted style="opacity:0;"></video>
  <div id="text-bubble"></div>
</div>

<script src="http://localhost:3000/socket.io/socket.io.js"></script>

<script>
const socket = io("http://localhost:3000");

const v1 = document.getElementById("v1");
const v2 = document.getElementById("v2");

let active = v1;
let next = v2;

const COSMO = {
  idle: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_happy: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_love: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_excited: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_sleep: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_angry: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm",
  react_book: "https://cdn.streamelements.com/uploads/01jz6fx3hgydm1w6h833k3y45z.webm"
};

v1.src = COSMO.idle;

function swap(src) {
  next.src = src;
  next.load();
  next.play();

  next.style.opacity = 1;
  active.style.opacity = 0;

  [active, next] = [next, active];
}

function state(name) {
  if (COSMO[name]) swap(COSMO[name]);
}

function speak(text) {
  const b = document.getElementById("text-bubble");
  b.textContent = text;
  b.classList.add("show");

  clearTimeout(window.t);
  window.t = setTimeout(() => b.classList.remove("show"), 3500);
}

/* =========================
   SOCKET LISTENER
========================= */

socket.on("cosmo-event", ({ event, user, extra }) => {

  console.log("COSMO EVENT:", event, user, extra);

  const actions = {
    pet: () => {
      state("react_happy");
      speak(`${user} pets Cosmo`);
    },

    love: () => {
      state("react_love");
      speak(`Cosmo glows softly...`);
    },

    play: () => {
      state("react_excited");
      speak(`Cosmo zooms through stars!`);
    },

    sleep: () => {
      state("react_sleep");
      speak(`Cosmo rests.`);
    },

    angry: () => {
      state("react_angry");
      speak(`Cosmo crackles...`);
    },

    hey: () => {
      state("react_happy");
      speak(`Cosmo appears!`);
    },

    drink: () => {
      state("idle");
      speak(`Cosmo sips tea.`);
    },

    book: () => {
      state("react_book");

      const title = extra?.title || "a celestial tome";
      const author = extra?.author || "unknown stars";
      const shelf = extra?.shelf || "?";

      speak(`Cosmo opens "${title}" by ${author} (Shelf ${shelf}) 📚`);
    }
  };

  if (actions[event]) actions[event]();
});
</script>

</body>
</html>
