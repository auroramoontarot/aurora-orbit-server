<!-- ============================================================
     ✨ HIGH-RES COVER UPGRADE
     
     Goodreads "medium" = SX98.
     We let Goodreads load normally, then request a larger
     version of the SAME cover from its image server.
     ============================================================ -->

<script>

(function () {

  const WIDGET_ID = "gr_grid_widget_1788374772";


  /* ----------------------------------------------------------
     UPGRADE ONE COVER
     ---------------------------------------------------------- */

  function upgradeCover(img) {

    if (!img || !img.src) {
      return;
    }

    let originalSrc = img.src;


    /*
       Examples:

       ._SX98_.jpg
             ↓
       ._SX300_.jpg

       or

       ._SY75_.jpg
             ↓
       ._SY450_.jpg
    */

    let highResSrc = originalSrc
      .replace(/\._SX\d+_\./, "._SX300_.")
      .replace(/\._SY\d+_\./, "._SY450_.");


    if (highResSrc !== originalSrc) {

      /*
         If Goodreads happens not to provide the larger
         version, fall back to the original image.
      */

      img.onerror = function () {

        img.onerror = null;

        if (img.src !== originalSrc) {
          img.src = originalSrc;
        }

      };


      img.src = highResSrc;

    }

  }


  /* ----------------------------------------------------------
     UPGRADE EVERY COVER CURRENTLY ON THE SHELF
     ---------------------------------------------------------- */

  function upgradeGoodreadsCovers() {

    const widget =
      document.getElementById(WIDGET_ID);

    if (!widget) {
      return;
    }


    const covers =
      widget.querySelectorAll(
        ".gr_grid_book_container img"
      );


    covers.forEach(function (img) {

      upgradeCover(img);

    });

  }


  /* ----------------------------------------------------------
     GOODREADS LOADS ASYNCHRONOUSLY

     Run several checks because Goodreads may replace the
     placeholder HTML after its external script finishes.
     ---------------------------------------------------------- */

  setTimeout(upgradeGoodreadsCovers, 250);

  setTimeout(upgradeGoodreadsCovers, 500);

  setTimeout(upgradeGoodreadsCovers, 1000);

  setTimeout(upgradeGoodreadsCovers, 2000);

  setTimeout(upgradeGoodreadsCovers, 4000);


  /* ----------------------------------------------------------
     WATCH FOR GOODREADS CHANGING THE BOOK GRID
     ---------------------------------------------------------- */

  const widget =
    document.getElementById(WIDGET_ID);


  if (widget) {

    const observer =
      new MutationObserver(function (mutations) {

        let needsUpgrade = false;


        mutations.forEach(function (mutation) {

          if (mutation.addedNodes.length > 0) {
            needsUpgrade = true;
          }

        });


        if (needsUpgrade) {

          setTimeout(
            upgradeGoodreadsCovers,
            50
          );

        }

      });


    observer.observe(
      widget,
      {
        childList: true,
        subtree: true
      }
    );

  }


  /* ----------------------------------------------------------
     INITIAL PASS
     ---------------------------------------------------------- */

  upgradeGoodreadsCovers();

})();

</script>
