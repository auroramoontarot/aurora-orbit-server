<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Constellation Jar</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --lav:#7f87ff;
  --teal:#00a9ba;
  --ice:#cbecf5;
  --soft:#c6c7f8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:'Quicksand',sans-serif;
}

.jar-widget{
  position:absolute;
  left:40px;
  bottom:40px;
  width:300px;
}

.jar{
  position:relative;
  width:145px;
  height:130px;
  margin:0 auto 16px;

  border-radius:24px 24px 40px 40px;

  border:2px solid rgba(203,236,245,.45);

  background:
    radial-gradient(
      circle at 45% 35%,
      rgba(255,255,255,.22),
      transparent 18%
    ),
    linear-gradient(
      180deg,
      rgba(203,236,245,.16),
      rgba(127,135,255,.10)
    );

  box-shadow:
    0 0 24px rgba(0,169,186,.30);

  overflow:hidden;
}

.jar::before{
  content:"";

  position:absolute;

  top:-8px;
  left:28px;

  width:88px;
  height:22px;

  border-radius:16px;

  border:2px solid rgba(203,236,245,.5);

  background:rgba(255,255,255,.12);
}

.count{
  text-align:center;

  font-size:20px;
  letter-spacing:.08em;

  color:rgba(203,236,245,.9);

  text-shadow:
    0 0 10px rgba(0,169,186,.4);
}

.star{
  position:absolute;

  opacity:.9;

  pointer-events:none;

  text-shadow:
    0 0 12px currentColor;

  animation:floatStar ease-in-out infinite;
}

@keyframes floatStar{
  0%,100%{
    transform:translateY(0) scale(1);
    opacity:.75;
  }

  50%{
    transform:translateY(-10px) scale(1.12);
    opacity:1;
  }
}
</style>
</head>

<body>

<section class="jar-widget">

  <div class="jar" id="jar"></div>

  <div class="count" id="count">
    Loading stardust...
  </div>

</section>

<script>

const DATA_URL = "/data/gratitude-jar.json";

const jarEl = document.getElementById("jar");
const countEl = document.getElementById("count");

function generateConstellationStars(total){

  jarEl.innerHTML = "";

  const visibleStars = Math.min(total, 60);

  const symbols = ["✦","✧","⋆","·"];

  const colors = [
    "#c6c7f8",
    "#7f87ff",
    "#00a9ba",
    "#cbecf5"
  ];

  for(let i = 0; i < visibleStars; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];

    star.style.color =
      colors[Math.floor(Math.random() * colors.length)];

    star.style.left =
      (Math.random() * 110 + 12) + "px";

    star.style.bottom =
      (Math.random() * 92 + 10) + "px";

    star.style.fontSize =
      (12 + Math.random() * 12) + "px";

    star.style.animationDuration =
      (4 + Math.random() * 5) + "s";

    star.style.animationDelay =
      (Math.random() * 5) + "s";

    jarEl.appendChild(star);
  }

  countEl.textContent =
    `✨ ${total} stars scattered ✨`;
}

async function loadJar(){

  try{

    const response =
      await fetch(DATA_URL + "?t=" + Date.now());

    const data =
      await response.json();

    if(Array.isArray(data)){

      generateConstellationStars(data.length);

    }else{

      generateConstellationStars(0);

    }

  }catch(error){

    console.error(
      "Could not load constellation jar:",
      error
    );

    countEl.textContent =
      "Constellation offline ✨";
  }
}

loadJar();

/* Refresh every minute */

setInterval(loadJar, 10000);

</script>

</body>
</html>
