<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --lav:#7f87ff;
  --teal:#00a9ba;
  --ice:#cbecf5;
  --soft:#c6c7f8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:'Quicksand',sans-serif;
}

.panel{

  width:100%;
  height:100%;

  position:relative;

  padding:4px;

  border-radius:20px;

  overflow:hidden;

}

/* shimmer */

.panel::before{

  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.05),
      transparent
    );

  transform:translateX(-100%);

  animation:shimmer 10s linear infinite;

  pointer-events:none;
}

@keyframes shimmer{
  to{
    transform:translateX(100%);
  }
}

/* header */

.header{

  color:#1f1c5a;

  font-size:15px;
  font-weight:700;

  letter-spacing:.12em;

  text-transform:uppercase;

  text-align:center;

  margin-bottom:18px;

  text-shadow:
    0 1px 2px rgba(255,255,255,.75),
    0 0 8px rgba(127,135,255,.25);
}

.user{

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  color:#7f87ff;

  font-size:20px;
  font-weight:700;

  text-shadow:
    0 1px 2px rgba(255,255,255,.75);
}

.emoji{
  font-size:22px;
}

.message{

  margin-top:1px;

  text-align:center;

  color:var(--teal);

  line-height:1.5;

  font-size:17px;

  font-weight:600;

  padding:0 1px;

  text-shadow:
    0 1px 2px rgba(255,255,255,.75);
}

.empty{

  text-align:center;

  color:#4d4d7a;

  font-size:16px;

  margin-top:2px;

  text-shadow:
    0 1px 2px rgba(255,255,255,.75);
}


/* glow when new mood arrives */

.panel.new-mood{

  animation:newMoodGlow 3s ease;
}

@keyframes newMoodGlow{

  0%{
    box-shadow:
      0 0 35px rgba(127,135,255,.5);
  }

  100%{
    box-shadow:
      0 0 20px rgba(127,135,255,.15);
  }
}

</style>
</head>
<body>

<div class="panel" id="panel">

  <div class="header">
    ☁ Current Conditions ☁
  </div>

  <div id="content">

    <div class="empty">
      drifting quietly tonight ✨
    </div>

  </div>

</div>

<script>

const panel =
  document.getElementById("panel");

const content =
  document.getElementById("content");

let latestMoodId = null;

function escapeHtml(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function loadMood(){

  try{

    const res =
      await fetch("/moods");

    const data =
      await res.json();

    const statuses =
      Array.isArray(data.statuses)
        ? data.statuses
        : [];

    if(!statuses.length){

      content.innerHTML = `
        <div class="empty">
          drifting quietly tonight ✨
        </div>
      `;

      return;
    }

    const mood = statuses[0];

    const moodId =
      mood.id ||
      JSON.stringify(mood);

    if(
      latestMoodId &&
      latestMoodId !== moodId
    ){

      panel.classList.remove("new-mood");

      void panel.offsetWidth;

      panel.classList.add("new-mood");
    }

    latestMoodId = moodId;

    const user =
      escapeHtml(
        mood.user || "Moonbeam"
      );

    const message =
      escapeHtml(
        mood.message || ""
      );

    const emoji =
      (user.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})/u)?.[0])
      || "✨";

    content.innerHTML = `

      <div class="user">

        <span class="emoji">
          ${emoji}
        </span>

        <span>
          ${user}
        </span>

      </div>

      <div class="message">
        "${message}"
      </div>

    `;

  }catch(err){

    content.innerHTML = `
      <div class="empty">
        mood signal unavailable ✨
      </div>
    `;

    console.error(err);
  }

}

loadMood();

setInterval(
  loadMood,
  10000
);

</script>

</body>
</html>
