<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<title>Aurora Moon Pomodoro</title>

<style>

:root{

  --text:#cbecf5;
  --soft:#c6c7f8;
  --aurora:#00a9ba;
  --primary:#7f87ff;
  --deep:#2b2772;

  --line:rgba(203,236,245,.22);

}

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;
  width:100%;
  height:100%;

  overflow:hidden;

  background:transparent;

  font-family:'Quicksand', sans-serif;
  color:var(--text);

}

.container{
  box-shadow:none !important;
}

.breath-glow{
  display:none !important;
}

.status{
  box-shadow:none !important;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{

  position:absolute;

  top:50%;
  left:50%;

  width:400px;
  height: 260px;
  
  padding:15px 20px 18px;

  transform:translate(-50%, -50%);

  text-align:center;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.18),
      rgba(255,255,255,.06)
    ),

    radial-gradient(
      circle at top left,
      rgba(203,236,245,.22),
      transparent 40%
    ),

    radial-gradient(
      circle at bottom right,
      rgba(127,135,255,.26),
      transparent 45%
    ),

    rgba(12,16,35,.72);

  border:1px solid var(--line);

  box-shadow:
    0 0 35px rgba(0,169,186,.26),
    0 0 80px rgba(127,135,255,.16),
    inset 0 0 28px rgba(255,255,255,.08);

  overflow:hidden;

}

/* =========================
   DATE + CLOCK
========================= */

.datetime{

  position:relative;
  z-index:2;

  margin-bottom:22px;

}

#clock{

  font-size:26px;
  font-weight:700;

  letter-spacing:1px;

  color:#f2fcff;

  text-shadow:
    0 0 10px rgba(203,236,245,.55);

}

#date{

  margin-top:8px;

  font-size:20px;

  color:rgba(203,236,245,.75);

  letter-spacing:.8px;

  text-transform:uppercase;

}

#worldClock{

  margin-top:5px;

  min-height:16px;

  font-size:16px;
  font-weight:600;

  color:rgba(198,199,248,.88);

  letter-spacing:.45px;

  white-space:nowrap;

  opacity:1;

  transition:opacity .45s ease;

  text-shadow:
    0 0 10px rgba(0,169,186,.20);

}

#worldClock.fading{
  opacity:0;
}

/* =========================
   STAR CORNER
========================= */

.container::after{

  content:"✦";

  position:absolute;

  top:18px;
  right:16px;

  font-size:20px;

  color:var(--soft);

  opacity:.62;

  text-shadow:0 0 16px var(--aurora);

  animation:twinkle 3.5s ease-in-out infinite;

}

/* =========================
   TIMER
========================= */

.timer{

  position:relative;
  z-index:2;

  font-size:42px;
  font-weight:700;

  line-height:1;

  margin-bottom:16px;

  letter-spacing:2px;

  color:#f2fcff;

  text-shadow:
    0 0 12px rgba(203,236,245,.82),
    0 0 28px rgba(0,169,186,.72),
    0 0 54px rgba(127,135,255,.45);

}

/* =========================
   STATUS
========================= */

.status{

  position:relative;
  z-index:2;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:100%;
  min-width:0;
 
  padding:12px;

  margin-top:10px;
  margin-bottom:10px;

  border-radius:999px;

  background:rgba(43,39,114,.34);

  border:1px solid rgba(203,236,245,.22);

  box-shadow:
    inset 0 0 14px rgba(255,255,255,.08),
    0 0 20px rgba(0,169,186,.18);

  font-size:18px;
  font-weight:700;

  letter-spacing:1px;

  opacity:.96;

  transition:all .6s ease;

}

/* =========================
   BREATHING GLOW
========================= */

.breath-glow{

  position:absolute;

  inset:-120px;

  background:
    radial-gradient(
      circle at center,
      rgba(127,135,255,.22),
      rgba(0,169,186,.08),
      transparent 65%
    );

  opacity:.65;

  animation:breathe 16s ease-in-out infinite;

}

/* =========================
   FLOATING STARS
========================= */

.stars{

  position:absolute;
  inset:0;

  overflow:hidden;
}

.star{

  position:absolute;

  width:2px;
  height:2px;

  border-radius:50%;
  background:white;

  opacity:.25;

  animation:starFloat linear infinite;

}

/* =========================
   MODE TRANSITIONS
========================= */

.focus-mode .status{

  box-shadow:
    inset 0 0 14px rgba(255,255,255,.08),
    0 0 22px rgba(127,135,255,.28);

}

.break-mode .status{

  box-shadow:
    inset 0 0 14px rgba(255,255,255,.08),
    0 0 28px rgba(0,169,186,.42);

}

/* =========================
   ANIMATIONS
========================= */

@keyframes breathe{

  0%{
    transform:scale(.75);
    opacity:.35;
  }

  25%{
    transform:scale(1);
    opacity:.9;
  }

  50%{
    transform:scale(1);
    opacity:.9;
  }

  75%{
    transform:scale(.72);
    opacity:.3;
  }

  100%{
    transform:scale(.72);
    opacity:.3;
  }

}

@keyframes twinkle{

  0%,100%{
    opacity:.35;
    transform:scale(.92) rotate(0deg);
  }

  50%{
    opacity:.9;
    transform:scale(1.12) rotate(12deg);
  }

}

@keyframes starFloat{

  0%{
    transform:translateY(0px);
    opacity:.15;
  }

  50%{
    transform:translateY(-14px);
    opacity:.85;
  }

  100%{
    transform:translateY(0px);
    opacity:.15;
  }

}

</style>
</head>

<body>

<div class="container focus-mode" id="container">

  <div class="breath-glow"></div>

  <div class="stars" id="stars"></div>

  <div class="datetime">
    <div id="clock">--:-- --</div>
    <div id="date">Loading Date...</div>
    <div id="worldClock">✨</div>
  </div>

  <div class="timer" id="timer">
    --:--
  </div>

  <div class="status" id="status">
    ✨ Focus Session
  </div>

</div>

<!-- =========================
     AUDIO
========================= -->

<audio id="chime">
  <source src="sounds/moonbeam.mp3" type="audio/mpeg">
</audio>

<script>

/* =========================
   ELEMENTS
========================= */

const timerDisplay =
  document.getElementById("timer");

const statusDisplay =
  document.getElementById("status");

const chime =
  document.getElementById("chime");

const container =
  document.getElementById("container");

const clockDisplay =
  document.getElementById("clock");

const dateDisplay =
  document.getElementById("date");

const worldClockDisplay =
  document.getElementById("worldClock");

/* =========================
   AUDIO
========================= */

function safePlay(audio){

  console.log("Chime attempting to play...");
  console.log("Audio source:", audio.currentSrc);
  console.log("Audio readyState:", audio.readyState);

  audio.play()
    .then(() => {
      console.log("✨ Chime played successfully!");
    })
    .catch(err => {
      console.error("🔇 Chime failed:", err.name, err.message);
    });

}

/* =========================
   DATE + TIME
========================= */

function updateDateTime(){

  const now = new Date();

  const time =
    now.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  const date =
    now.toLocaleDateString([],{
      weekday:"short",
      month:"short",
      day:"numeric"
    });

  clockDisplay.textContent = time;
  dateDisplay.textContent = date;

}

/* =========================
   WORLD TIME ROTATION
========================= */

const constellationTimes = [
  { city:"Honolulu",    zone:"Pacific/Honolulu" },
  { city:"Los Angeles", zone:"America/Los_Angeles" },
  { city:"New York",    zone:"America/New_York" },
  { city:"São Paulo",   zone:"America/Sao_Paulo" },
  { city:"London",      zone:"Europe/London" },
  { city:"Berlin",      zone:"Europe/Berlin" },
  { city:"Cape Town",   zone:"Africa/Johannesburg" },
  { city:"Mumbai",      zone:"Asia/Kolkata" },
  { city:"Singapore",   zone:"Asia/Singapore" },
  { city:"Tokyo",       zone:"Asia/Tokyo" },
  { city:"Sydney",      zone:"Australia/Sydney" },
  { city:"Auckland",    zone:"Pacific/Auckland" }
];

let constellationIndex = 0;

function getLocalHour(timeZone){

  const parts =
    new Intl.DateTimeFormat("en-US",{
      timeZone,
      hour:"2-digit",
      hourCycle:"h23"
    }).formatToParts(new Date());

  const hourPart =
    parts.find(part => part.type === "hour");

  return hourPart
    ? Number(hourPart.value)
    : 12;

}

function getDaypartIcon(hour){

  if(hour >= 5 && hour < 8)  return "🌅";
  if(hour >= 8 && hour < 12) return "☕";
  if(hour >= 12 && hour < 17) return "☀️";
  if(hour >= 17 && hour < 21) return "🌆";

  return "🌙";

}

function renderConstellationTime(){

  const place =
    constellationTimes[constellationIndex];

  const now =
    new Date();

  const time =
    new Intl.DateTimeFormat("en-US",{
      timeZone:place.zone,
      hour:"numeric",
      minute:"2-digit"
    }).format(now);

  const icon =
    getDaypartIcon(
      getLocalHour(place.zone)
    );

  worldClockDisplay.textContent =
    `✨ ${place.city} ${time} ${icon}`;

}

function rotateConstellationTime(){

  worldClockDisplay.classList.add("fading");

  setTimeout(() => {

    constellationIndex =
      (constellationIndex + 1) %
      constellationTimes.length;

    renderConstellationTime();

    requestAnimationFrame(() => {
      worldClockDisplay.classList.remove("fading");
    });

  }, 450);

}

function startConstellationClock(){

  renderConstellationTime();

  setInterval(
    rotateConstellationTime,
    10000
  );

}

/* =========================
   STAR GENERATOR
========================= */

const starsContainer =
  document.getElementById("stars");

for(let i = 0; i < 80; i++){

  const star =
    document.createElement("div");

  star.classList.add("star");

  star.style.left =
    Math.random() * 100 + "%";

  star.style.top =
    Math.random() * 100 + "%";

  star.style.animationDuration =
    (4 + Math.random() * 6) + "s";

  star.style.animationDelay =
    Math.random() * 6 + "s";

  starsContainer.appendChild(star);

}

/* =========================
   PHASE STATE
========================= */

let lastPhase = null;

/* =========================
   SESSION LOGIC
========================= */

function getSessionState(){

  const now = new Date();

  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  let phase;
  let remaining;

  if(minutes < 25){

    phase = "FOCUS";

    remaining =
      (24 - minutes) * 60 + (60 - seconds);

  }

  else if(minutes < 30){

    phase = "BREAK";

    remaining =
      (29 - minutes) * 60 + (60 - seconds);

  }

  else if(minutes < 55){

    phase = "FOCUS";

    remaining =
      (54 - minutes) * 60 + (60 - seconds);

  }

  else{

    phase = "BREAK";

    remaining =
      (59 - minutes) * 60 + (60 - seconds);

  }

  return {
    phase,
    remaining
  };

}

/* =========================
   MODE SWITCH
========================= */

function applyFocusMode(){

  container.classList.remove("break-mode");
  container.classList.add("focus-mode");

  statusDisplay.textContent =
    "✨ Focus Session";

  window.parent.postMessage({
    type:"breathMode",
    mode:"focus"
  }, "*");

}

function applyBreakMode(){

  container.classList.remove("focus-mode");
  container.classList.add("break-mode");

  statusDisplay.textContent =
    "☕ Stardust Break";

  window.parent.postMessage({
    type:"breathMode",
    mode:"break"
  }, "*");

}

/* =========================
   MAIN LOOP
========================= */

function startAutoPomodoro(){

  function update(){

    updateDateTime();

    const {
      phase,
      remaining
    } = getSessionState();

    const min =
      Math.floor(remaining / 60);

    const sec =
      remaining % 60;

    timerDisplay.textContent =
      `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

    /* =========================
       PHASE CHANGES
    ========================= */

    if(phase !== lastPhase){

      lastPhase = phase;

      chime.currentTime = 0;

      safePlay(chime);

      if(phase === "BREAK"){

        applyBreakMode();

        fetch(
          "http://localhost:3000/coffee-break",
          { method:"POST" }
        ).catch(err =>
          console.error(
            "Coffee break trigger failed:",
            err
          )
        );

      }

      else{

        applyFocusMode();

        fetch(
          "http://localhost:3000/focus-start",
          { method:"POST" }
        ).catch(err =>
          console.error(
            "Focus start trigger failed:",
            err
          )
        );

      }

    }

  }

  update();

  setInterval(update, 1000);

}

/* =========================
   INIT
========================= */

startAutoPomodoro();
startConstellationClock();

</script>

</body>
</html>
