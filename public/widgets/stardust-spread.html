<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stardust Session</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lav:#7f87ff;
  --teal:#00a9ba;
  --ice:#cbecf5;
  --soft:#c6c7f8;
  --deep:#2b2772;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:'Quicksand',sans-serif;
}

.session{
  width:1400px;
  height:800px;
  position:relative;
  color:white;
}

.title{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:34px;
  font-weight:700;

  text-shadow:
    0 0 20px rgba(127,135,255,.8),
    0 0 35px rgba(0,169,186,.25);
}

.subtitle{
  font-size:14px;
  letter-spacing:4px;
  opacity:.9;
}

.card-slot{
  position:absolute;
  width:220px;
  text-align:center;
}

.label{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:8px;
}

/* CARD */

.card{
  width:150px;
  height:240px;

  margin:auto;
  position:relative;

  border-radius:28px;
  overflow:hidden;

  background:
    url('/widgets/cards/aurora-card.png')
    center/cover no-repeat;

  box-shadow:
  0 0 30px rgba(255,255,255,.15),
  0 0 50px rgba(127,135,255,.25);
}

.card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      rgba(255,255,255,.22),
      rgba(255,255,255,.42)
    );
}

.symbol,
.card-title,
.card-keyword{
  position:relative;
  z-index:2;
  color:var(--deep);
}

.symbol{
  margin-top:30px;
  font-size:56px;
  font-weight:700;
}

.card-title{
  margin-top:12px;
  padding:0 14px;

  font-size:18px;
  font-weight:700;
  line-height:1.15;
}

.card-keyword{
  margin-top:8px;
  padding:0 14px;

  font-size:11px;
  line-height:1.3;
}

.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;

  height:100%;

  position:relative;
  z-index:2;

  color:var(--deep);
  font-weight:700;
}

/* SPREAD POSITIONS */

#guiding{
  top:100px;
  left:590px;
transform:rotate(-1.2deg);
}

#grounding{
  top:150px;
  left:190px;
transform:rotate(1.5deg);
}

#future{
  top:150px;
  right:190px;
transform:rotate(-1.5deg);
}

#present{
  top:380px;
  left:590px;
transform:rotate(1.4deg);
}

#gift{
  top:420px;
  left:190px;
transform:rotate(-1.6deg);
}

#insight{
  top:420px;
  right:190px;
transform:rotate(1.4deg);
}

/* INTERPRETATION PANEL */

.interpretation{
  position:absolute;

  left:240px;
  right:240px;
  bottom:10px;

  height:150px;

  padding:16px 22px;
  box-sizing:border-box;

  border-radius:22px;

  background:
    rgba(15,20,50,.82);

  border:
    1px solid rgba(203,236,245,.18);

  backdrop-filter:
    blur(10px);

  box-shadow:
    0 0 18px rgba(127,135,255,.18);
}

.ititle{
  font-size:20px;
  font-weight:700;
}

.ikey{
  font-size:12px;
  color:var(--soft);
  margin-top:4px;
}

.imsg{
  margin-top:8px;
  line-height:1.35;
  font-size:14px;
}

.iact{
  margin-top:8px;
  color:var(--ice);
  font-size:13px;
}

/* STARS */

.star{
  position:absolute;
  color:white;
  opacity:.35;
  animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
  from{
    opacity:.15;
  }
  to{
    opacity:.6;
  }
}
</style>
</head>
<body>
<div class="session">
<div class="title">✨ Aurora Moon Tarot<div class="subtitle">STARDUST SESSION</div></div>

<div id="guiding" class="card-slot"></div>
<div id="grounding" class="card-slot"></div>
<div id="future" class="card-slot"></div>
<div id="present" class="card-slot"></div>
<div id="gift" class="card-slot"></div>
<div id="insight" class="card-slot"></div>

<div class="interpretation">
<div id="ititle" class="ititle">Waiting for cards...</div>
<div id="ikey" class="ikey"></div>
<div id="imsg" class="imsg"></div>
<div id="iact" class="iact"></div>
</div>
</div>

<script>
const positions=[
{id:'guiding',label:'Guiding Star'},
{id:'present',label:'Present'},
{id:'future',label:'Future'},
{id:'grounding',label:'Grounding'},
{id:'gift',label:'Cosmic Gift'},
{id:'insight',label:'Moonbeam Insight'}
];

let spreadCards=[];
let cycle=0;

function cardHTML(card,label){
return `<div class="label">${label}</div>
<div class="card">
<div class="symbol">${card.symbol||'✨'}</div>
<div class="card-title">${card.title||''}</div>
<div class="card-keyword">${card.keyword||''}</div>
</div>`;
}

function placeholder(label){
return `<div class="label">${label}</div>
<div class="card"><div class="placeholder">Awaiting Card</div></div>`;
}

function render(){
positions.forEach((p,i)=>{
document.getElementById(p.id).innerHTML=spreadCards[i]?cardHTML(spreadCards[i],p.label):placeholder(p.label);
});
}

function rotateCard(){
if(!spreadCards.length) return;
const c=spreadCards[cycle];
ititle.textContent=c.title||'';
ikey.textContent=c.keyword||'';
imsg.textContent=c.message||'';
iact.textContent=c.action||'';
cycle=(cycle+1)%spreadCards.length;
}

setInterval(rotateCard,15000);

const stream=new EventSource('/cardstream');

stream.onmessage=(event)=>{
const data=JSON.parse(event.data);

if(data.type==='init'){
spreadCards=[];
(data.draws||[]).slice(0,6).reverse().forEach(c=>spreadCards.push(c));
render();
rotateCard();
}

if(data.type==='new'){
if(spreadCards.length<6){
spreadCards.push(data.draw);
render();
rotateCard();
}
}

if(data.type==='clear'){
spreadCards=[];
cycle=0;
render();
ititle.textContent='Waiting for cards...';
ikey.textContent='';
imsg.textContent='';
iact.textContent='';
}
};

render();
</script>
</body>
</html>
