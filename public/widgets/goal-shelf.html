<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Moonbeam Shelf Cart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:transparent;
    font-family:'Quicksand',sans-serif;
}


/* =========================================
   MAIN CART
========================================= */

.cart-widget{

    position:relative;

    width:1100px;

    height:900px;

    overflow:visible;

}


.cart{

    position:absolute;

    inset:0;

}


/* =========================================
   FLOATING PARTICLES
========================================= */

.particles{

    position:absolute;

    inset:-40px 0 0 0;

    pointer-events:none;

    overflow:hidden;

    z-index:1;

}


.sparkle{

    position:absolute;

    width:4px;

    height:4px;

    border-radius:50%;

    background:
        rgba(255,255,255,.9);

    box-shadow:

        0 0 6px rgba(255,255,255,.8),

        0 0 12px rgba(203,236,245,.6);

    opacity:.5;

    animation:
        floatUp linear infinite;

}


@keyframes floatUp{

    from{

        transform:
            translateY(0)
            translateX(0)
            scale(.5);

        opacity:0;

    }


    15%{

        opacity:1;

    }


    to{

        transform:

            translateY(-260px)

            translateX(
                calc((var(--drift) - .5) * 60px)
            )

            scale(1.4);

        opacity:0;

    }

}


/* =========================================
   STATUS / TOP RIGHT
========================================= */

.footer{

    position:absolute;

    right:24px;

    top:18px;

    text-align:right;

}


.goal{

    font-size:18px;

    font-weight:700;

    color:#50517d;

}


.progress{

    margin-top:4px;

    font-size:15px;

    color:#6466a0;

}


/* =========================================
   SHELF AREA
========================================= */

.shelf-area{

    position:absolute;

    left:40px;

    right:40px;

    bottom:70px;

    height:140px;

}



/* =========================================
   BOOKS
========================================= */

.books{

    position:absolute;

    bottom:12px;
    left:220px;
    right:220px;
    justify-content:center;

    display:flex;

    align-items:flex-end;

    gap:8px;

    overflow:hidden;

    z-index:2;

}


.book{

    width:32px;

    flex-shrink:0;

    border-radius:
        2px 2px 0 0;

    position:relative;

    box-shadow:
        0 0 10px rgba(255,255,255,.2);

    animation:
        bookAppear .5s ease;

}

/* =========================================
   WOOD SHELF
========================================= */

.shelf-board{

    position:absolute;

    bottom:0;

    width:100%;

    height:14px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #7f5c4b,
            #5b3e32
        );

    box-shadow:
        0 4px 10px rgba(0,0,0,.25);

    z-index:3;

}

/* =========================================
   MOONBEAM LIBRARY PLAQUE
========================================= */

.shelf-label{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:-60px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:8px 16px;

    border-radius:18px;


    background:
        rgba(40,50,90,.82);


    border:
        2px solid rgba(203,236,245,.25);


    box-shadow:
        0 0 16px rgba(127,135,255,.18);


    z-index:10;

}


.moon-small{

    width:24px;

    height:24px;

    border-radius:50%;


    background:
        radial-gradient(
            circle at 30% 30%,
            white,
            #cbecf5 70%,
            #7f87ff
        );


    box-shadow:
        0 0 10px rgba(203,236,245,.5);

}


.library-name{

    font-size:13px;

    font-weight:700;

    color:#cbecf5;

}


.library-progress{

    margin-top:2px;

    font-size:13px;

    color:#c6c7f8;

}


/* =========================================
   DECOR ITEMS
========================================= */

.decor{

    position:absolute;

    bottom:18px;

    left:24px;

    display:flex;

    align-items:flex-end;

    gap:11px;

    z-index:4;

}


/* =========================================
   MOONBEAM MAGIC CANDLE
========================================= */

.candle{

    position:relative;

    width:65px;

    height:125px;

    transform:translateY(6px);

}


.candle-glow{

    position:absolute;

    left:50%;

    bottom:45px;

    width:110px;

    height:110px;

    transform:translateX(-50%);

    border-radius:50%;


    background:

        radial-gradient(
            circle,
            rgba(198,199,248,.45),
            rgba(127,135,255,.18),
            transparent 70%
        );


    animation:

        candleGlow 2s infinite ease-in-out;

}


@keyframes candleGlow{

    0%,100%{

        opacity:.55;

        transform:
            translateX(-50%)
            scale(1);

    }


    50%{

        opacity:.9;

        transform:
            translateX(-50%)
            scale(1.15);

    }

}


.wax{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:58px;

    height:90px;

    border-radius:

        14px 14px 10px 10px;


    background:

        linear-gradient(
            90deg,
            #e8e5ff,
            #c6c7f8,
            #f4f2ff
        );


    box-shadow:

        inset -8px 0 12px rgba(127,135,255,.18),

        0 0 20px rgba(127,135,255,.45);

}


.drip{

    position:absolute;

    top:-2px;

    background:#cbecf5;

    border-radius:

        0 0 10px 10px;

}


.drip-one{

    left:12px;

    width:10px;

    height:28px;

}


.drip-two{

    left:30px;

    width:8px;

    height:18px;

}


.drip-three{

    right:10px;

    width:12px;

    height:35px;

}


.wick{

    position:absolute;

    bottom:86px;

    left:50%;

    transform:translateX(-50%);

    width:4px;

    height:14px;

    background:#5b3e32;

    border-radius:4px;

}


.flame{

    position:absolute;

    bottom:99px;

    left:50%;

    width:32px;

    height:48px;

    transform:translateX(-50%);


    background:

        radial-gradient(
            ellipse at bottom,
            #ffffff 0%,
            #fff7c2 25%,
            #ffd166 55%,
            #ff9f43 75%,
            transparent 72%
        );


    border-radius:

        50% 50% 45% 45%;


    filter:

        drop-shadow(0 0 8px #fff1a8)

        drop-shadow(0 0 22px #ffcc66);


    animation:

        flameDance 1.4s infinite ease-in-out;

    transform-origin:center bottom;

}


@keyframes flameDance{

    0%{

        transform:
            translateX(-50%)
            rotate(-4deg)
            scale(1);

    }

    25%{

        transform:
            translateX(-46%)
            rotate(5deg)
            scale(1.1);

    }

    50%{

        transform:
            translateX(-53%)
            rotate(-6deg)
            scale(.95);

    }

    75%{

        transform:
            translateX(-48%)
            rotate(3deg)
            scale(1.08);

    }

    100%{

        transform:
            translateX(-50%)
            rotate(-4deg)
            scale(1);

    }

}


.flame span{

    position:absolute;

    bottom:8px;

    left:50%;

    width:8px;

    height:18px;

    transform:translateX(-50%);

    background:#fff;

    border-radius:50%;

    opacity:.8;

}


.flame::before,
.flame::after{

    content:"✦";

    position:absolute;

    color:#fff4b0;

    font-size:10px;

    text-shadow:

        0 0 8px #ffd166;


    animation:

        emberFloat 3s infinite ease-in-out;

}


.flame::before{

    left:-18px;

    bottom:30px;

}


.flame::after{

    right:-16px;

    bottom:45px;

    animation-delay:1.5s;

}


@keyframes emberFloat{

    0%{

        opacity:0;

        transform:
            translateY(10px)
            scale(.6);

    }


    30%{

        opacity:1;

    }


    100%{

        opacity:0;

        transform:
            translateY(-45px)
            scale(1.2);

    }

}


/* =========================================
   PLANT
========================================= */

.plant{

    font-size:100px;

    line-height:1;

    transform:translateY(6px);

}


/* =========================================
   GRATITUDE JAR
========================================= */

.mini-jar{

    position:relative;
bottom:-3px;

    width:105px;

    height:130px;

    border-radius:

        12px 12px 18px 18px;


    border:

        2px solid rgba(203,236,245,.45);


    background:

        rgba(203,236,245,.12);


    box-shadow:

        0 0 16px rgba(127,135,255,.22);


    overflow:hidden;

}


.mini-jar::before{

    content:"";

    position:absolute;

    top:-6px;

    left:50%;

    width:61%;

    height:14px;

    transform:translateX(-50%);

    border-radius:10px;


    border:

        2px solid rgba(203,236,245,.4);


    background:

        rgba(255,255,255,.08);

}


.jar-star{

    position:absolute;

    animation:

        miniFloat ease-in-out infinite;

    opacity:.9;

    text-shadow:

        0 0 13px currentColor;

    pointer-events:none;

}


@keyframes miniFloat{

    0%,100%{

        transform:
            translateY(0)
            scale(1);

    }

    50%{

        transform:
            translateY(-3px)
            scale(1.08);

    }

}


/* =========================================
   TAROT MINI CARD
========================================= */

.tarot-mini{

    width:70px;

    height:105px;

    border-radius:12px;

    padding:8px;


    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;


    background:

        linear-gradient(
            145deg,
            rgba(127,135,255,.5),
            rgba(43,39,114,.8)
        );


    border:

        1px solid rgba(203,236,245,.3);


    box-shadow:

        0 0 14px rgba(127,135,255,.4);


    transform:

        rotate(-7deg)
        translateY(5px);


    animation:

        cardFloat 5s ease-in-out infinite;

}


.mini-card-symbol{

    font-size:32px;

}


.mini-card-title{

    margin-top:5px;

    font-size:10px;

    text-align:center;

    color:#cbecf5;

}


@keyframes cardFloat{

    0%,100%{

        transform:
            rotate(-7deg)
            translateY(5px);

    }


    50%{

        transform:
            rotate(-7deg)
            translateY(-3px);

    }

}

/* =========================================
   MAGIC TELESCOPE
========================================= */

.telescope{

    position:absolute;

    right:175px;

    bottom:14px;

    font-size:111px;

    line-height:1;

    z-index:4;

    filter:

        drop-shadow(0 0 8px rgba(203,236,245,.6))

        drop-shadow(0 0 18px rgba(127,135,255,.35));

    animation:

        telescopeFloat 5s ease-in-out infinite;

}


@keyframes telescopeFloat{

    0%,100%{

        transform:
            translateY(0);

    }

    50%{

        transform:
            translateY(-4px);

    }

}

.potion{

    position:absolute;

    right:165px;
    bottom:12px;

    width:62px;
    height:92px;

    z-index:4;

    border-radius:
        16px 16px 18px 18px;

    background:
        rgba(203,236,245,.14);

    border:
        2px solid rgba(203,236,245,.45);

    overflow:hidden;

    box-shadow:
        0 0 12px rgba(0,169,186,.35),
        0 0 24px rgba(127,135,255,.25),
        inset 0 0 10px rgba(255,255,255,.15);

}

.cork{

    position:absolute;

    left:50%;
    top:-8px;

    width:22px;
    height:14px;

    transform:translateX(-50%);

    background:#8b6a52;

    border-radius:4px;

}

.liquid{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:58%;

    background:
        linear-gradient(
            #00d4ff,
            #7f87ff
        );

    animation:
        potionWave 5s ease-in-out infinite;

}

@keyframes potionWave{

    0%,100%{

        height:58%;

    }

    50%{

        height:62%;

    }

}

.bubble{

    position:absolute;

    border-radius:50%;

    background:
        rgba(255,255,255,.7);

    animation:
        bubbleFloat linear infinite;

}

.b1{

    width:8px;
    height:8px;

    left:22px;
    bottom:20px;

    animation-duration:3s;

}

.b2{

    width:5px;
    height:5px;

    left:38px;
    bottom:12px;

    animation-duration:2.2s;

    animation-delay:.7s;

}

@keyframes bubbleFloat{

    from{

        transform:
            translateY(0);

        opacity:0;

    }

    20%{

        opacity:1;

    }

    to{

        transform:
            translateY(-38px);

        opacity:0;

    }

}

/* =========================================
   FAIRY LIGHTS
========================================= */

.lights {

    position:absolute;

    top:50px;

    left:80px;

    right:80px;

    height:50px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:5;

}


.light {

    width:12px;

    height:12px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #cbecf5 35%,
            #7f87ff 70%,
            transparent 100%
        );


    box-shadow:

        0 0 8px #cbecf5,

        0 0 18px #7f87ff,

        0 0 30px rgba(203,236,245,.8);


    animation:

        fairyGlow 2.5s infinite ease-in-out;

}


.light:nth-child(2n){
    animation-delay:.4s;
}

.light:nth-child(3n){
    animation-delay:.8s;
}

.light:nth-child(4n){
    animation-delay:1.2s;
}


@keyframes fairyGlow {

    0%,100% {

        opacity:.65;

        transform:
            translateY(0)
            scale(1);

    }


    50% {

        opacity:1;

        transform:
            translateY(3px)
            scale(1.25);

    }

}

</style>

<body>

<div class="cart-widget">

    <div class="particles" id="particles"></div>

    <div class="cart">

        <!-- FAIRY LIGHTS -->

        <div class="lights">

            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>

        </div>






        <!-- SHELF -->

        <div class="shelf-area">

    <!-- Books -->
    <div class="books" id="books"></div>

    <!-- Left Decor -->
    <div class="decor">

        <div class="plant">
            🪴
        </div>

        <div
            class="mini-jar"
            id="miniJar">
        </div>

        <div class="candle">

            <div class="candle-glow"></div>

            <div class="flame">
                <span></span>
            </div>

            <div class="wick"></div>

            <div class="wax">
                <div class="drip drip-one"></div>
                <div class="drip drip-two"></div>
                <div class="drip drip-three"></div>
            </div>

        </div>

        <div class="tarot-mini">

            <div
                class="mini-card-symbol"
                id="miniCardSymbol">
                🌙
            </div>

            <div
                class="mini-card-title"
                id="miniCardTitle">
                The Moon
            </div>

        </div>

    </div>

<!-- Magic Telescope -->

<div class="telescope">
    🔭
</div>

    <!-- Right Potion Bottle -->
    <div class="potion">

        <div class="cork"></div>

        <div class="liquid"></div>

        <div class="bubble b1"></div>

        <div class="bubble b2"></div>

    </div>

    <!-- Shelf -->
    <div class="shelf-board"></div>

    <!-- Shelf Label -->
    <div class="shelf-label">

        <div class="moon-small"></div>

        <div class="label-text">

            <div class="library-name">
                Moonbeam Library
            </div>

            <div
                class="library-progress"
                id="progressText">
                0 Books • 0 Moonbeams
            </div>

        </div>

    </div>

</div>


    </div>

</div>





<script>


/* =========================================
   MOONBEAM SHELF DATA
========================================= */


let currentGoal = 0;

let maxGoal = 0;



async function loadMoonbeams(){


    try{

    const response =
    await fetch(
        '../data/moonbeams.json?t='
        + Date.now()
    );



        const data =
            await response.json();




        maxGoal =
            Number(
                data.goal || 0
            );




        currentGoal =
            Object.values(
                data.platforms || {}
            )
            .reduce(
                (total,value)=>{

                    return total + Number(value || 0);

                },
                0
            );




        buildShelf();



    }catch(error){


        console.error(
            "Moonbeam Shelf Error:",
            error
        );


        buildShelf();


    }


}







/* =========================================
   BOOK COLORS
========================================= */


const colors = [

    '#7f87ff',
    '#00a9ba',
    '#cbecf5',
    '#c6c7f8',
    '#ffcce6',
    '#8da0ff',
    '#82dfe8'

];







function buildShelf(){


    const booksContainer =
        document.getElementById(
            "books"
        );



    if(!booksContainer){

        return;

    }



    booksContainer.innerHTML = "";




    const maxVisibleBooks = 20;




    /*
        100 Moonbeams = 1 book
    */

    const visibleBooks =
        Math.min(
            Math.floor(currentGoal / 100),
            maxVisibleBooks
        );






    for(
        let i = 0;
        i < visibleBooks;
        i++
    ){



        const book =
            document.createElement(
                "div"
            );



        book.className =
            "book";



        book.style.height =
            (
                Math.floor(
                    Math.random() * 60
                )
                + 60
            )
            + "px";



        book.style.background =
            colors[
                Math.floor(
                    Math.random()
                    *
                    colors.length
                )
            ];



        booksContainer.appendChild(
            book
        );


    }





    const progress =
        document.getElementById(
            "progressText"
        );



    if(progress){


        progress.innerText =
            `${visibleBooks} Books • ${currentGoal} Moonbeams`;


    }


}





loadMoonbeams();







/* =========================================
   PARTICLES
========================================= */


function createSparkle(){


    const container =
        document.getElementById(
            "particles"
        );



    if(!container){

        return;

    }



    const sparkle =
        document.createElement(
            "div"
        );



    sparkle.className =
        "sparkle";



    sparkle.style.left =
        Math.random() * 920 + "px";



    sparkle.style.top =
        (
            Math.random() * 540
            + 20
        )
        + "px";



    sparkle.style.animationDuration =
        (
            Math.random() * 4
            + 3
        )
        + "s";



    sparkle.style.setProperty(
        "--drift",
        Math.random()
    );



    container.appendChild(
        sparkle
    );



    setTimeout(()=>{

        sparkle.remove();

    },7000);


}



setInterval(
    createSparkle,
    400
);









/* =========================================
   GRATITUDE MINI JAR
========================================= */


const miniJar =
    document.getElementById(
        "miniJar"
    );





async function loadConstellationJar(){


    if(!miniJar){

        return;

    }



    try{


        const response =
            await fetch(
                '/data/gratitude-jar.json?t='
                + Date.now()
            );



        const entries =
            await response.json();



        generateMiniJar(
            Array.isArray(entries)
            ? entries.length
            : 0
        );



    }catch(error){


        console.error(
            "Mini jar failed:",
            error
        );


        generateMiniJar(0);


    }


}






function generateMiniJar(total){


    if(!miniJar){

        return;

    }



    miniJar.innerHTML = "";



    const visibleStars =
        Math.min(
            total,
            30
        );



    const symbols = [
        "✦",
        "✧",
        "⋆",
        "·"
    ];



    const starColors = [
        "#cbecf5",
        "#7f87ff",
        "#c6c7f8",
        "#00a9ba"
    ];





    for(
        let i = 0;
        i < visibleStars;
        i++
    ){



        const star =
            document.createElement(
                "div"
            );



        star.className =
            "jar-star";



        star.innerText =
            symbols[
                Math.floor(
                    Math.random()
                    *
                    symbols.length
                )
            ];



        star.style.color =
            starColors[
                Math.floor(
                    Math.random()
                    *
                    starColors.length
                )
            ];



        star.style.left =
            (
                Math.random() * 72 + 8
            )
            + "px";



        star.style.bottom =
            (
                Math.random() * 80 + 8
            )
            + "px";



        star.style.fontSize =
            (
                8 +
                Math.random() * 6
            )
            + "px";



        star.style.animationDuration =
            (
                3 +
                Math.random() * 3
            )
            + "s";



        miniJar.appendChild(
            star
        );


    }


}





loadConstellationJar();

/* =========================================
   CURRENT TAROT CARD
========================================= */

async function loadCurrentTarot(){

    try{

        const response =
            await fetch(
                '/tarot-current?t='
                + Date.now()
            );

        if(!response.ok){

            throw new Error(
                "Tarot data unavailable"
            );

        }

        const card =
            await response.json();

        const symbol =
            document.getElementById(
                "miniCardSymbol"
            );

        const title =
            document.getElementById(
                "miniCardTitle"
            );

        if(symbol){

            symbol.innerText =
                card.symbol ||
                "🌙";

        }

        if(title){

            title.innerText =
                card.title ||
                "The Moon";

        }

    }
    catch(error){

        console.error(
            "Tarot mini card failed:",
            error
        );

    }

}

/* initial load */

loadCurrentTarot();

/* refresh every minute */

setInterval(
    loadCurrentTarot,
    60000
);


</script>


</body>
</html>
