<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<title>The Observatory</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="observatory-panel">


    <div class="title">
        Aurora Moon Haven
  <span id="observatoryTemp">--°</span>
</div>

    <div class="orbit-section">

        <div class="label">
            🌙 Current Orbit
        </div>


        <div class="event-row">

            <div id="currentEmoji" class="emoji">
                🌙
            </div>


            <div class="event-info">

                <div id="currentTitle" class="event-title">
                    Loading...
                </div>


                <div id="currentSubtitle" class="event-time">
                    ...
                </div>

            </div>

        </div>


    </div>



    <div class="divider"></div>



    <div class="orbit-section">


        <div class="label">
            ✨ Next Constellation
        </div>


        <div class="event-row">

            <div id="nextEmoji" class="emoji">
                ✨
            </div>


            <div class="event-info">


                <div id="nextTitle" class="event-title">
                    Loading...
                </div>


                <div id="nextSubtitle" class="event-time">
                    ...
                </div>


            </div>


        </div>


    </div>


</div>


<script src="script.js"></script>


</body>

</html>
