<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora's Adventure Log</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  font-family: "Quicksand", sans-serif;
  color: #cbecf5;
}

/* =========================
   CHAT (UNCHANGED)
========================= */
#chat {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px 14px;
  border-radius: 16px;
  max-width: 100%;
  word-wrap: break-word;
  font-size: 14px;
  line-height: 1.3;

  animation: popIn 0.3s ease, fadeOut 0.6s ease forwards;
  animation-delay: 0s, 25s;

  backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.chat { background: rgba(198,199,248,0.22); border: 1px solid rgba(198,199,248,0.35); }
.status { background: rgba(0,169,186,0.18); border: 1px solid rgba(0,169,186,0.35); font-style: italic; }
.astrea { background: rgba(127,135,255,0.18); border: 1px solid rgba(127,135,255,0.35); }

@keyframes popIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

/* =========================
   ADVENTURE HUD (FLAT + TOP ALIGNED)
========================= */

#adventureHUD {
  position: absolute;
  bottom: 22px;
  left: 22px;

  width: 340px;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;

  gap: 6px;

  /* IMPORTANT: prevents "jumping" when text changes */
  min-height: 110px;

  /* subtle HUD feel without a card */
  padding: 6px 8px;

  /* no background, just glow separation */
}

/* header row */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  width: 100%;

  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;

  color: rgba(203,236,245,.65);

  margin-bottom: 2px;
}

.sparkle {
  animation: twinkle 2.6s ease-in-out infinite;
}

/* content block locked so it never shifts */
.content {
  width: 100%;
  min-height: 80px;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
}

/* main title */
.title {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.2;

  text-shadow:
    0 0 10px rgba(203,236,245,.35),
    0 0 18px rgba(0,169,186,.18);

  min-height: 20px;
}

/* status line */
.row {
  font-size: 13px;
  color: rgba(203,236,245,.8);

  min-height: 18px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 4px;
}

/* each box must be stable */
.time-box {
  text-align: center;
  padding: 6px 4px;
  border-radius: 12px;

  background: rgba(8, 12, 34, 0.10);
  border: 1px solid rgba(203, 236, 245, 0.12);

  min-height: 44px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* CRITICAL: prevents number shifting */
.number {
  font-size: 16px;
  font-weight: 700;
  line-height: 1;

  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* label stays stable */
.unit {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(203, 236, 245, 0.65);
}

/* badge FIX (no stretching EVER) */
.badge {
  display: inline-flex;
  align-self: flex-start;

  width: fit-content;
  max-width: 100%;

  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;

  background: rgba(127,135,255,.12);
  border: 1px solid rgba(203,236,245,.16);

  white-space: nowrap;
}

/* friend line */
.friend {
  font-size: 13px;
  color: rgba(203,236,245,.75);

  min-height: 18px;
}

/* fade without layout shift */
.fade {
  animation: fadeIn .25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes twinkle {
  0%,100% { opacity: .5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}
</style>
</head>
<body>

<div class="log-card">
  <div class="topline">
    <div class="label">Aurora's Adventure Log</div>
    <div class="sparkle">✨</div>
  </div>

  <div id="releaseView">
    <div class="game-title" id="gameTitle"></div>
    <div class="platform" id="platform"></div>

    <div class="countdown">
      <div class="time-box"><div class="number" id="days">0</div><div class="unit">Days</div></div>
      <div class="time-box"><div class="number" id="hours">0</div><div class="unit">Hours</div></div>
      <div class="time-box"><div class="number" id="minutes">0</div><div class="unit">Min</div></div>
      <div class="time-box"><div class="number" id="seconds">0</div><div class="unit">Sec</div></div>
    </div>

    <div class="vibe" id="vibe"></div>
  </div>

  <div id="adventureView" style="display:none;">
    <div class="adventure-block">
      <div class="game-title" id="advTitle"></div>

      <div class="platform" id="advPlatformBadge">
  Adventure Status
</div>

<div class="vibe">
  🔭 Telescope <span id="advStatus"></span>
</div>

<div class="vibe friend">
  ✨ Streaming With<br>
  <strong id="advFriend"></strong>
</div>
    </div>
  </div>
</div>

<script>
let adventureCard = {
  title: "Loading...",
  status: "",
  friendPlatform: "",
  friendName: ""
};

async function loadAdventureCard() {

  try {

    const res = await fetch(
      "http://localhost:3000/adventure-log?nocache=" + Date.now()
    );

    const data = await res.json();

    adventureCard = data;

    updateDisplay();

  } catch(err) {

    console.error("Adventure load failed:", err);
  }
}

const games = [

  {
    title: "Moonlight Peaks",
    date: "2026-07-07T08:00:00",
    platform: ["Steam","Switch"],
    vibe: "garlic snacks packed"
  },
  {
    title: "Mothkeep",
    date: "2026-07-10T08:00:00",
    platform: ["Steam"],
    vibe: "winged magic awaits"
  },
  {
    title: "Catio Simulator",
    date: "2026-07-10T08:00:00",
    platform: ["Steam"],
    vibe: "adopt them alllllll"
  },
  {
    title: "Bookbinding - Dark Cozy Sim",
    date: "2026-07-16T08:00:00",
    platform: ["Steam"],
    vibe: "quiet creative space"
  },

  {
    title: "Suncraft",
    date: "2026-07-28T08:00:00",
    platform: ["Steam"],
    vibe: "pretty pixel plans"
  },
  {
    title: "Leafy Corner",
    date: "2026-07-30T08:00:00",
    platform: ["Steam"],
    vibe: "watering can ready"
  },
  {
    title: "Black Cat Book Club",
    date: "2026-07-31T08:00:00",
    platform: ["Steam"],
    vibe: "cozy bookish vibes"
  },
  {
    title: "Forever Ago",
    date: "2026-10-08T08:00:00",
    platform: ["Steam","PS5","XBox","Switch"],
    vibe: "roadtrip playlist mixed"
  }
];

const ROTATE_EVERY = 12000;
let slideIndex = 0;

function getUpcomingGames(){
  const now = new Date();
  return games
    .map(g => ({...g, releaseDate:new Date(g.date)}))
    .filter(g => g.releaseDate >= now)
    .sort((a,b) => a.releaseDate - b.releaseDate);
}

function getSlides(){
  const releases = getUpcomingGames();
  const slides = [];

  releases.forEach(game => {
    slides.push({type:"adventure"});
    slides.push({type:"release", data:game});
  });

  if(slides.length === 0){
    slides.push({type:"adventure"});
  }

  return slides;
}

function showAdventure(){
  document.getElementById("releaseView").style.display = "none";
  document.getElementById("adventureView").style.display = "block";

  document.getElementById("advTitle").textContent = adventureCard.title;
  document.getElementById("advStatus").textContent = adventureCard.status;
  document.getElementById("advPlatformBadge").textContent =
  adventureCard.friendPlatform;
  document.getElementById("advFriend").textContent = adventureCard.friendName;
}

function showRelease(game){
  document.getElementById("releaseView").style.display = "block";
  document.getElementById("adventureView").style.display = "none";

  const diff = game.releaseDate - new Date();

  document.getElementById("gameTitle").textContent = game.title;
  document.getElementById("platform").textContent = game.platform.join(" • ");
  document.getElementById("vibe").textContent = game.vibe;

  document.getElementById("days").textContent = Math.floor(diff/(1000*60*60*24));
  document.getElementById("hours").textContent = Math.floor((diff/(1000*60*60))%24);
  document.getElementById("minutes").textContent = Math.floor((diff/(1000*60))%60);
  document.getElementById("seconds").textContent = Math.floor((diff/1000)%60);
}

function updateDisplay(){
  const slides = getSlides();

  if(slideIndex >= slides.length){
    slideIndex = 0;
  }

  const slide = slides[slideIndex];

  if(slide.type === "adventure"){
    showAdventure();
  } else {
    showRelease(slide.data);
  }
}

function rotateSlide(){
  slideIndex++;
  updateDisplay();
}

loadAdventureCard();
updateDisplay();

setInterval(loadAdventureCard, 10000);

setInterval(() => {
  const slides = getSlides();
  if(slides[slideIndex]?.type === "release"){
    showRelease(slides[slideIndex].data);
  }
}, 1000);

setInterval(rotateSlide, ROTATE_EVERY);
</script>

</body>
</html>
