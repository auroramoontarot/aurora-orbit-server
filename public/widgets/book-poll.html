<!DOCTYPE html>

<title>Aurora Moonbeam Book Club Poll</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<div id="gr_poll_widget_337256">

<style>
/* =====================================================
   🌙 MOONBEAM BOOK CLUB POLL
   Aurora Moon Tarot
   ===================================================== */

#gr_poll_widget_337256 {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  font-family: 'Quicksand', sans-serif;
  color: #cbecf5;
}

#gr_poll_widget_337256 .moonbeam-poll {
  position: relative;
  overflow: hidden;

  padding: 22px;

  border: 1px solid rgba(198, 199, 248, 0.35);
  border-radius: 22px;

  background:
    radial-gradient(circle at top left,
      rgba(127, 135, 255, 0.24),
      transparent 42%),
    radial-gradient(circle at bottom right,
      rgba(0, 169, 186, 0.18),
      transparent 46%),
    rgba(43, 39, 114, 0.78);

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.28),
    inset 0 0 30px rgba(203, 236, 245, 0.04);

  backdrop-filter: blur(12px);
}

#gr_poll_widget_337256 .moonbeam-poll::before {
  content: "✦";
  position: absolute;
  top: 12px;
  right: 16px;

  color: #c6c7f8;
  font-size: 18px;
  opacity: 0.75;
}

#gr_poll_widget_337256 .poll-kicker {
  text-align: center;

  color: #00a9ba;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

#gr_poll_widget_337256 .poll-title {
  margin-top: 6px;

  text-align: center;
  color: #cbecf5;

  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
}

#gr_poll_widget_337256 .poll-subtitle {
  margin: 8px 0 18px;

  text-align: center;

  color: #c6c7f8;
  font-size: 15px;
  line-height: 1.45;
}

#gr_poll_widget_337256 .poll-options {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

#gr_poll_widget_337256 .poll-option {
  display: block;

  width: 100%;
  box-sizing: border-box;
  margin: 0;

  padding: 11px 14px;

  border: 1px solid rgba(203, 236, 245, 0.22);
  border-radius: 14px;

  background: rgba(203, 236, 245, 0.08);

  color: #cbecf5;
  text-align: center;
  text-decoration: none;

  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

#gr_poll_widget_337256 .poll-option:hover {
  transform: translateY(-2px);

  background: rgba(127, 135, 255, 0.22);

  border-color: rgba(0, 169, 186, 0.7);

  box-shadow:
    0 5px 18px rgba(0, 169, 186, 0.12);
}

#gr_poll_widget_337256 .poll-footer {
  margin-top: 16px;

  text-align: center;

  font-size: 13px;
  line-height: 1.8;
}

#gr_poll_widget_337256 .poll-footer a {
  color: #c6c7f8;
  text-decoration: none;
}

#gr_poll_widget_337256 .poll-footer a:hover {
  color: #00a9ba;
  text-decoration: underline;
}

#gr_poll_widget_337256 .poll-note {
  margin-top: 14px;

  text-align: center;
  color: rgba(203, 236, 245, 0.68);

  font-size: 11px;
}
</style>

<div class="moonbeam-poll">

  <div class="poll-kicker">
    🌙 Moonbeam Book Club
  </div>

  <div class="poll-title">
    September 2026 Book Club Vote
  </div>

  <div class="poll-subtitle">
    Which story should enter our next orbit? ✨
  </div>

  <div class="poll-options">

    <a
      class="poll-option"
      target="_blank"
      rel="nofollow noopener noreferrer"
      data-method="post"
      href="https://www.goodreads.com/poll/vote/337256-september-2026-book-club-suggestions?answer=2206573"
    >

    <a

    >

    </a>

    <a
      class="poll-option"
      target="_blank"
      rel="nofollow noopener noreferrer"
      data-method="post"
      href="https://www.goodreads.com/poll/vote/337256-september-2026-book-club-suggestions?answer=2206571"
    >
      ✨ The Witches of Cambridge
    </a>

    <a
      class="poll-option"
      target="_blank"
      rel="nofollow noopener noreferrer"

      href="https://www.goodreads.com/poll/vote/337256-september-2026-book-club-suggestions?answer=2206572"
    >
      👻 Grim Tidings
    </a>

  </div>
 
  <div class="poll-note">
    !bookpoll ✦ link to vote
  </div>

</div>

</div>
</html>
