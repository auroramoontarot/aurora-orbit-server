<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            ellipse at center,
            rgba(127,135,255,0.35) 0%,
            rgba(43,39,114,0.80) 35%,
            rgba(8,10,20,0.95) 100%
        );
}

body::after{
    content:"🌙 Sleep Mode";
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    font-family:'Quicksand', sans-serif;
    font-size:36px;
    font-weight:600;
    letter-spacing:1px;

    color:rgba(203,236,245,0.75);

    text-shadow:
        0 0 10px rgba(127,135,255,0.4),
        0 0 20px rgba(127,135,255,0.2);
}
</style>
</head>
<body>
</body>
</html>
