<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<title>Aurora Mission Tracker</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:'Quicksand',sans-serif;
}

body{
    display:flex;
    justify-content:left;
    align-items:center;
}

.status-bar{
    font-size:15px;
    font-weight:700;
    color:#cbecf5;
    text-align:left;
    white-space:nowrap;

    text-shadow:
        0 0 10px rgba(0,169,186,.8),
        0 0 20px rgba(127,135,255,.5),
        0 0 35px rgba(127,135,255,.3);
}

.now{
    color:#cbecf5;
}

.separator{
    margin:0 13px;
    color:#7f87ff;
    opacity:.75;
}

.next{
    color:#c6c7f8;
}

</style>
</head>

<body>

<div class="status-bar">

    <span id="currentTask" class="now">
        🌟 NOW: Loading...
    </span>

    <span class="separator">|</span>

    <span id="nextTask" class="next">
        🌙 NEXT: Loading...
    </span>

</div>

<script>

async function fetchTaskData() {

    try {

        const res = await fetch(
            "/data/aurora-task.json?nocache=" + Date.now()
        );

        if (!res.ok) {
            throw new Error("Task file not found");
        }

        const data = await res.json();

        document.getElementById("currentTask").textContent =
            "🌟 NOW: " + (data.task || "Awaiting Assignment");

        document.getElementById("nextTask").textContent =
            "🌙 NEXT: " + (data.next || "Awaiting Assignment");

    }

    catch(err) {

        console.error(err);

        document.getElementById("currentTask").textContent =
            "🌟 NOW: Mission signal unavailable";

        document.getElementById("nextTask").textContent =
            "🌙 NEXT: ---";

    }

}

fetchTaskData();
setInterval(fetchTaskData, 60000);

</script>

</body>
</html>
